[package]
name = "phone-book"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
